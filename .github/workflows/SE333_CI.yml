name: SE333_CI
on:
  push:
    branches:
      - main

jobs:
  SE333_CI_JOB:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-repo
        uses: actions/checkout@v4

      - name: setupJava
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Install Linter
        run: echo "Checkstyle is configured through Maven"

      - name: Run Checkstyle
        run: mvn validate

      - name: Upload Checkstyle Result
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-result
          path: target/checkstyle.xml
          if-no-files-found: warn

      - name: Run Maven Test
        run: mvn test

      - name: Jacoco Report
        run: mvn jacoco:report

      - name: Upload Jacoco Result
        uses: actions/upload-artifact@v4
        with:
            name: jacoco-report
            path: target/site/jacoco/jacoco.xml
            if-no-files-found: warn